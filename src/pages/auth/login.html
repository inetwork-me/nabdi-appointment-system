<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="docTitle.login">تسجيل الدخول — بوابة الطاقم الطبي</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../components/components.css" />
    <link rel="stylesheet" href="../../layouts/auth-layout.css" />
      <script src="../../scripts/i18n.js"></script>
  </head>
  <body data-layout="auth">
    <div data-page>
      <div class="auth__panel">
        <header class="auth__header">
          <h1 class="auth__title" data-i18n="auth.login.title">تسجيل الدخول</h1>
          <p class="auth__subtitle" data-i18n="auth.login.subtitle">أدخل بياناتك للوصول إلى لوحة تحكم الطاقم الطبي.</p>
        </header>

        <form class="auth__form" data-next="../dashboard/index.html" novalidate>
          <div class="field">
            <label class="label" for="email" data-i18n="auth.email.label">البريد الإلكتروني المهني</label>
            <input class="input" id="email" name="email" type="email" inputmode="email" dir="ltr" autocomplete="username" placeholder="doctor@alshifa.com" required />
          </div>

          <div class="field">
            <div class="field__row">
              <label class="label" for="password" data-i18n="auth.password.label">كلمة المرور</label>
              <a class="link" href="forgot-password.html" data-i18n="auth.forgot">نسيت كلمة المرور؟</a>
            </div>
            <div class="input-group">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
              <button class="icon-btn" type="button" data-password-toggle="password" aria-pressed="false" aria-label="إظهار كلمة المرور" data-i18n-aria-label="auth.showPassword">
                <svg class="icon icon--on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon icon--off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
              </button>
            </div>
          </div>

          <label class="checkbox">
            <input type="checkbox" name="remember" />
            <span class="checkbox__box">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
            <span data-i18n="auth.remember">تذكرني على هذا الجهاز</span>
          </label>

          <button class="btn btn--primary btn--lg btn--block" type="submit" data-i18n="auth.signIn">تسجيل الدخول</button>
        </form>

        <div class="alert alert--info" role="note">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          <div class="alert__body">
            <span data-i18n="auth.accountsNote">الحسابات تُنشأ من قِبل إدارة المجمع فقط. للحصول على حساب أو دعم الدخول، تواصل مع إدارة تقنية المعلومات.</span>
          </div>
        </div>
      </div>
    </div>

    <script src="../../layouts/layout.js"></script>
    <script src="../../scripts/auth.js"></script>
  </body>
</html>
