<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="docTitle.changed">تم تغيير كلمة المرور — بوابة الطاقم الطبي</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../components/components.css" />
    <link rel="stylesheet" href="../../layouts/auth-layout.css" />
      <script src="../../scripts/i18n.js"></script>
  </head>
  <body data-layout="auth">
    <div data-page>
      <div class="auth__panel">
        <div class="state-icon state-icon--success" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
        </div>

        <header class="auth__header">
          <h1 class="auth__title" data-i18n="auth.changed.title">تم تغيير كلمة المرور بنجاح</h1>
          <p class="auth__subtitle" data-i18n="auth.changed.subtitle">يمكنك الآن تسجيل الدخول إلى حسابك باستخدام كلمة المرور الجديدة.</p>
        </header>

        <a class="btn btn--primary btn--lg btn--block" href="login.html" data-i18n="auth.backToLogin">العودة إلى تسجيل الدخول</a>

        <div class="alert alert--info" role="note">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <div class="alert__body">
            <span data-i18n="auth.changed.note">لأمان حسابك، سُجّل خروجك من جميع الأجهزة الأخرى. يُرجى تسجيل الدخول من جديد.</span>
          </div>
        </div>
      </div>
    </div>

    <script src="../../layouts/layout.js"></script>
    <script src="../../scripts/auth.js"></script>
  </body>
</html>
