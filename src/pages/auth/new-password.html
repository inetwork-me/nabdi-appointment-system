<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="docTitle.newpass">إنشاء كلمة مرور جديدة — بوابة الطاقم الطبي</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../components/components.css" />
    <link rel="stylesheet" href="../../layouts/auth-layout.css" />
      <script src="../../scripts/i18n.js"></script>
  </head>
  <body data-layout="auth">
    <div data-page>
      <div class="auth__panel">
        <header class="auth__header">
          <h1 class="auth__title" data-i18n="auth.newpass.title">إنشاء كلمة مرور جديدة</h1>
          <p class="auth__subtitle" data-i18n="auth.newpass.subtitle">اختر كلمة مرور قوية لم تستخدمها من قبل.</p>
        </header>

        <form class="auth__form" data-next="password-changed.html" novalidate>
          <div class="field">
            <label class="label" for="password" data-i18n="auth.newpass.new">كلمة المرور الجديدة</label>
            <div class="input-group">
              <input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="أدخل كلمة المرور الجديدة" data-i18n-placeholder="auth.newpass.newPlaceholder" data-password-input required />
              <button class="icon-btn" type="button" data-password-toggle="password" aria-pressed="false" aria-label="إظهار كلمة المرور" data-i18n-aria-label="auth.showPassword">
                <svg class="icon icon--on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon icon--off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
              </button>
            </div>
          </div>

          <ul class="reqs" data-password-reqs aria-label="متطلبات كلمة المرور" data-i18n-aria-label="auth.reqs.label">
            <li class="reqs__item" data-req="length">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
              <span data-i18n="auth.req.length">٨ أحرف على الأقل</span>
            </li>
            <li class="reqs__item" data-req="case">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
              <span data-i18n="auth.req.case">حرف كبير وحرف صغير</span>
            </li>
            <li class="reqs__item" data-req="number">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
              <span data-i18n="auth.req.number">رقم واحد على الأقل</span>
            </li>
          </ul>

          <div class="field">
            <label class="label" for="confirm" data-i18n="auth.newpass.confirm">تأكيد كلمة المرور</label>
            <div class="input-group">
              <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="أعد إدخال كلمة المرور" data-i18n-placeholder="auth.newpass.confirmPlaceholder" data-confirm-input aria-describedby="confirm-error" required />
              <button class="icon-btn" type="button" data-password-toggle="confirm" aria-pressed="false" aria-label="إظهار كلمة المرور" data-i18n-aria-label="auth.showPassword">
                <svg class="icon icon--on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon icon--off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
              </button>
            </div>
            <span class="error" id="confirm-error" data-confirm-error hidden data-i18n="auth.newpass.mismatch">كلمتا المرور غير متطابقتين.</span>
          </div>

          <button class="btn btn--primary btn--lg btn--block" type="submit" data-i18n="auth.newpass.save">حفظ كلمة المرور</button>
        </form>

        <p class="auth__footer">
          <a class="link auth__back" href="login.html">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            <span data-i18n="auth.backToLogin">العودة إلى تسجيل الدخول</span>
          </a>
        </p>
      </div>
    </div>

    <script src="../../layouts/layout.js"></script>
    <script src="../../scripts/auth.js"></script>
  </body>
</html>
