<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="docTitle.otp">التحقق من الرمز — بوابة الطاقم الطبي</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../components/components.css" />
    <link rel="stylesheet" href="../../layouts/auth-layout.css" />
      <script src="../../scripts/i18n.js"></script>
  </head>
  <body data-layout="auth">
    <div data-page>
      <div class="auth__panel">
        <header class="auth__header">
          <h1 class="auth__title" data-i18n="auth.otp.title">التحقق من الرمز</h1>
          <p class="auth__subtitle"><span data-i18n="auth.otp.subtitle">أدخل الرمز المكوّن من ٦ أرقام المُرسل إلى</span> <strong>doctor@alshifa.com</strong></p>
        </header>

        <form class="auth__form" data-next="new-password.html" novalidate>
          <div class="field">
            <div class="otp" data-otp="otp-code" dir="ltr">
              <input class="otp__slot" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="الرقم ١" autofocus />
              <input class="otp__slot" type="text" inputmode="numeric" maxlength="1" aria-label="الرقم ٢" />
              <input class="otp__slot" type="text" inputmode="numeric" maxlength="1" aria-label="الرقم ٣" />
              <input class="otp__slot" type="text" inputmode="numeric" maxlength="1" aria-label="الرقم ٤" />
              <input class="otp__slot" type="text" inputmode="numeric" maxlength="1" aria-label="الرقم ٥" />
              <input class="otp__slot" type="text" inputmode="numeric" maxlength="1" aria-label="الرقم ٦" />
            </div>
            <input type="hidden" id="otp-code" name="code" />
          </div>

          <button class="btn btn--primary btn--lg btn--block" type="submit" data-otp-submit disabled data-i18n="auth.otp.verify">تحقّق من الرمز</button>

          <p class="auth__otp-resend" data-resend="30">
            <span data-resend-prompt data-i18n="auth.otp.noCode">لم يصلك الرمز؟ </span>
            <span data-resend-count></span>
            <button type="button" data-i18n="auth.otp.resend">إعادة إرسال الرمز</button>
          </p>
        </form>

        <p class="auth__footer">
          <a class="link auth__back" href="forgot-password.html">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            <span data-i18n="auth.otp.changeEmail">تغيير البريد الإلكتروني</span>
          </a>
        </p>
      </div>
    </div>

    <script src="../../layouts/layout.js"></script>
    <script src="../../scripts/auth.js"></script>
  </body>
</html>
