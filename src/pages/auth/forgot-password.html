<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="docTitle.forgot">استعادة كلمة المرور — بوابة الطاقم الطبي</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../components/components.css" />
    <link rel="stylesheet" href="../../layouts/auth-layout.css" />
      <script src="../../scripts/i18n.js"></script>
  </head>
  <body data-layout="auth">
    <div data-page>
      <div class="auth__panel">
        <header class="auth__header">
          <h1 class="auth__title" data-i18n="auth.forgot.title">استعادة كلمة المرور</h1>
          <p class="auth__subtitle" data-i18n="auth.forgot.subtitle">أدخل بريدك الإلكتروني المهني وسنرسل لك رمز تحقق لإعادة تعيين كلمة المرور.</p>
        </header>

        <form class="auth__form" data-next="otp.html" novalidate>
          <div class="field">
            <label class="label" for="email" data-i18n="auth.email.label">البريد الإلكتروني المهني</label>
            <input class="input" id="email" name="email" type="email" inputmode="email" dir="ltr" autocomplete="username" placeholder="doctor@alshifa.com" required />
            <span class="hint" data-i18n="auth.forgot.hint">سنرسل رمزًا مكوّنًا من ٦ أرقام صالحًا لمدة ١٠ دقائق.</span>
          </div>

          <button class="btn btn--primary btn--lg btn--block" type="submit" data-i18n="auth.forgot.send">إرسال رمز التحقق</button>
        </form>

        <p class="auth__footer">
          <a class="link auth__back" href="login.html">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            <span data-i18n="auth.backToLogin">العودة إلى تسجيل الدخول</span>
          </a>
        </p>
      </div>
    </div>

    <script src="../../layouts/layout.js"></script>
    <script src="../../scripts/auth.js"></script>
  </body>
</html>
