<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="docTitle.nextVisit">نوع الزيارة القادمة — بوابة الطاقم الطبي</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../components/components.css" />
    <link rel="stylesheet" href="../../layouts/dashboard-layout.css" />
      <script src="../../scripts/i18n.js"></script>
  </head>
  <body data-layout="dashboard" data-nav="visits" data-title="نوع الزيارة القادمة" data-subtitle="اختر نوع الموعد الذي يحتاجه المريض بعد انتهاء هذه الاستشارة." data-title-key="pages.nextVisit.title" data-subtitle-key="pages.nextVisit.subtitle">
    <div data-page>
      <div class="page page--wide">
        <div class="choice-grid">
          <!-- Option A · Free follow-up consultation -->
          <a class="card choice-card" href="follow-up-confirm.html">
            <div class="card__body choice-card__body">
              <div class="choice-card__head">
                <span class="state-icon state-icon--success" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>
                </span>
                <span class="badge badge--success" data-i18n="nextVisit.opt1.badge">مجاني</span>
              </div>
              <div class="choice-card__text">
                <h2 class="choice-card__title" data-i18n="nextVisit.opt1.title">استشارة متابعة مجانية</h2>
                <p class="choice-card__desc" data-i18n="nextVisit.opt1.desc">تحديد موعد متابعة مجاني خلال ١٤ يومًا من تاريخ الزيارة الحالية لمتابعة حالة المريض دون إضافة خدمات علاجية.</p>
              </div>
              <span class="btn btn--primary btn--lg btn--block choice-card__action" data-i18n="nextVisit.select">اختيار</span>
            </div>
          </a>

          <!-- Option B · Treatment services -->
          <a class="card choice-card" href="treatment-plan.html">
            <div class="card__body choice-card__body">
              <div class="choice-card__head">
                <span class="state-icon state-icon--info" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 14h6"/><path d="M12 11v6"/></svg>
                </span>
                <span class="badge badge--info" data-i18n="nextVisit.opt2.badge">خدمات</span>
              </div>
              <div class="choice-card__text">
                <h2 class="choice-card__title" data-i18n="nextVisit.opt2.title">خدمات علاجية</h2>
                <p class="choice-card__desc" data-i18n="nextVisit.opt2.desc">إضافة الخدمات أو الإجراءات العلاجية المطلوبة للمريض في الزيارات القادمة.</p>
              </div>
              <span class="btn btn--primary btn--lg btn--block choice-card__action" data-i18n="nextVisit.select">اختيار</span>
            </div>
          </a>
        </div>

        <!-- Back to patient details -->
        <div class="page-actions">
          <a class="btn btn--outline btn--lg" href="patient-details.html" data-i18n="nextVisit.back">العودة إلى تفاصيل المريض</a>
        </div>
      </div>
    </div>

    <script src="../../layouts/layout.js"></script>
  </body>
</html>
