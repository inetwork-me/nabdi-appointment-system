<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="docTitle.settings">الإعدادات — بوابة الطاقم الطبي</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../components/components.css" />
    <link rel="stylesheet" href="../../layouts/dashboard-layout.css" />
      <script src="../../scripts/i18n.js"></script>
  </head>
  <body data-layout="dashboard" data-nav="settings" data-title="الإعدادات" data-subtitle="تفضيلات الحساب والنظام" data-title-key="pages.settings.title" data-subtitle-key="pages.settings.subtitle">
    <div data-page>
      <div class="page page--wide">
        <section class="card" aria-label="التفضيلات" data-i18n-aria-label="settings.preferencesAria">
          <div class="card__body">
            <h2 class="card__heading">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg>
              <span data-i18n="settings.preferences">التفضيلات العامة</span>
            </h2>
            <dl class="detail-list">
              <div class="detail-list__row">
                <dt class="detail-list__label" data-i18n="settings.language">اللغة</dt>
                <dd class="detail-list__value" data-i18n="settings.languageValue">العربية</dd>
              </div>
              <div class="detail-list__row">
                <dt class="detail-list__label" data-i18n="settings.timezone">المنطقة الزمنية</dt>
                <dd class="detail-list__value" data-i18n="settings.timezoneValue">(GMT+3) الرياض</dd>
              </div>
              <div class="detail-list__row">
                <dt class="detail-list__label" data-i18n="settings.notifications">إشعارات وصول المرضى</dt>
                <dd class="detail-list__value"><span class="badge badge--success" data-i18n="settings.notifOn">مفعّلة</span></dd>
              </div>
            </dl>
          </div>
        </section>

        <section class="card" aria-label="الأمان" data-i18n-aria-label="settings.security">
          <div class="card__body">
            <h2 class="card__heading">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <span data-i18n="settings.security">الأمان</span>
            </h2>
            <div class="page-actions">
              <a class="btn btn--outline btn--lg" href="../auth/new-password.html" data-i18n="settings.changePassword">تغيير كلمة المرور</a>
            </div>
          </div>
        </section>

        <div class="alert alert--info" role="note">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          <div class="alert__body">
            <span data-i18n="settings.devNote">مزيد من الإعدادات (الأدوار والصلاحيات وتكامل الأنظمة) ستتوفر ضمن التحديثات القادمة.</span>
          </div>
        </div>
      </div>
    </div>

    <script src="../../layouts/layout.js"></script>
  </body>
</html>
